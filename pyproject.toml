[project]
name = "readout"
version = "0.1.0"
description = "Clinical trial probability of success and risk-adjusted valuation from public evidence"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]
license = {text = "MIT"}

[project.optional-dependencies]
dev = ["pytest>=7", "statsmodels>=0.14"]

[tool.pytest.ini_options]
testpaths = ["tests"]
